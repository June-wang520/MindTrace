{% extends 'base.html' %}
{% block title %}登录 | MindTrace{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-5 shadow-lg border-0 rounded-4" style="width: 100%; max-width: 420px;">
        <h2 class="text-center text-primary mb-4">🌿 欢迎回到 MindTrace</h2>

        {% if form.errors %}
            <div class="alert alert-danger text-center">
                用户名或密码错误，请重试。
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">用户名</label>
                <input type="text" name="username" autofocus required class="form-control" placeholder="请输入用户名">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">密码</label>
                <input type="password" name="password" required class="form-control" placeholder="请输入密码">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100 py-2">登录</button>
            </div>
        </form>


    </div>
</div>
{% endblock %}
