{% extends 'base.html' %}
{% block title %}修改日记 | MindTrace{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow-lg p-4 border-0 rounded-4">
        <h2 class="text-center text-warning mb-4">✏️ 修改日记</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">所得</label>
                <textarea name="所得" rows="2" class="form-control">{{ entry.所得 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">更好</label>
                <textarea name="更好" rows="2" class="form-control">{{ entry.更好 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">生理</label>
                <input type="text" name="生理" class="form-control" value="{{ entry.生理 }}">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">情绪</label>
                <textarea name="情绪" rows="2" class="form-control">{{ entry.情绪 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">想做</label>
                <input type="text" name="想做" class="form-control" value="{{ entry.想做 }}">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">图片</label>
                {% if entry.image %}
                    <div class="mb-2">
                        <img src="{{ entry.image.url }}" class="img-fluid rounded" style="max-width: 200px;">
                    </div>
                {% endif %}
                <input type="file" name="image" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">音频</label>
                {% if entry.audio %}
                    <div class="mb-2">
                        <audio controls>
                            <source src="{{ entry.audio.url }}">
                        </audio>
                    </div>
                {% endif %}
                <input type="file" name="audio" class="form-control">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-warning px-4">保存修改</button>
                <a href="{% url 'entry_list' %}" class="btn btn-outline-secondary ms-2">返回列表</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
