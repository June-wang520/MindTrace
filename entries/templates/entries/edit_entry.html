{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 700px;">
  <h2 class="text-center mb-4 text-primary">✏️ 修改日记</h2>

  <div class="card shadow-sm border-0 rounded-3 p-4">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">日期</label>
        {{ form.date }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">所得</label>
        {{ form.所得 }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">更好</label>
        {{ form.更好 }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">生理</label>
        {{ form.生理 }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">心情</label>
        {{ form.心情 }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">想做</label>
        {{ form.想做 }}
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">图片 / 音频</label>
        {{ form.image }}
        {{ form.audio }}
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="{% url 'entry_list' %}" class="btn btn-outline-secondary">
          ← 返回
        </a>
        <button type="submit" class="btn btn-primary">
          💾 保存修改
        </button>
      </div>
    </form>
  </div>
</div>

<style>
  input, textarea, select {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
  }
  textarea { min-height: 100px; }
  .card { background-color: #fdfdfd; }
  h2 { font-weight: 600; }
</style>
{% endblock %}
